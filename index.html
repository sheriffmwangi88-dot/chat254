<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>CHAT 254</title>

<style>

/* =================================
   BASIC RESET
================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  background: #07152f;
  color: white;
}


/* =================================
   PROFESSIONAL ANDROID SPLASH
================================= */

#openingScreen {
  position: fixed;
  inset: 0;
  z-index: 99999;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 50% 40%,
      #173c78 0%,
      #0d2450 35%,
      #07152f 75%
    );

  animation: splashOut 0.45s ease forwards;
  animation-delay: 1.15s;
}


/* SPLASH CONTENT */

.openingContent {
  width: 100%;
  text-align: center;

  display: flex;
  flex-direction: column;
  align-items: center;

  animation: splashIn 0.55s ease-out;
}


/* SPLASH LOGO */

.openingLogo {
  width: 92px;
  height: 92px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 26px;

  background: linear-gradient(
    145deg,
    #287cff,
    #1454c4
  );

  box-shadow:
    0 12px 35px rgba(0,0,0,0.35),
    0 0 30px rgba(40,124,255,0.25);

  font-size: 48px;

  margin-bottom: 22px;

  animation: logoPulse 1.4s ease-in-out infinite;
}


/* SPLASH TITLE */

.openingTitle {
  font-size: 38px;
  font-weight: 800;

  letter-spacing: 2px;

  color: #ffffff;

  text-shadow:
    0 3px 15px rgba(0,0,0,0.3);
}


/* BY SHERIFF */

.openingBy {
  margin-top: 9px;

  font-size: 16px;
  font-weight: 600;

  color: #6fa7ff;

  letter-spacing: 1px;
}


/* SPLASH SUBTITLE */

.openingSub {
  margin-top: 10px;

  font-size: 13px;

  color: #aebbd2;

  letter-spacing: 0.5px;
}


/* LOADING BAR */

.openingLoader {
  width: 38px;
  height: 4px;

  margin-top: 28px;

  border-radius: 10px;

  background: rgba(255,255,255,0.15);

  overflow: hidden;

  position: relative;
}

.openingLoader::after {
  content: "";

  position: absolute;

  left: -100%;

  top: 0;

  width: 100%;
  height: 100%;

  background: #287cff;

  animation: loaderMove 0.9s ease-in-out infinite;
}


/* SPLASH ANIMATIONS */

@keyframes splashIn {

  from {
    opacity: 0;
    transform: scale(0.92);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}


@keyframes logoPulse {

  0%,
  100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.04);
  }

}


@keyframes loaderMove {

  from {
    left: -100%;
  }

  to {
    left: 100%;
  }

}


@keyframes splashOut {

  0% {
    opacity: 1;
    visibility: visible;
  }

  100% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

}


/* =================================
   MAIN APP
================================= */

#app {
  width: 100%;
  max-width: 650px;

  margin: 0 auto;

  padding: 18px 15px 30px;
}


h1 {
  text-align: center;

  font-size: 34px;

  margin-top: 5px;
}


.subtitle {
  text-align: center;

  color: #aebbd2;

  margin: 8px 0 22px;
}


/* =================================
   LANGUAGE SELECTORS
================================= */

.languages {
  display: flex;

  align-items: center;

  gap: 8px;

  margin-bottom: 15px;
}


select {
  flex: 1;

  min-width: 0;

  height: 50px;

  padding: 0 10px;

  border: none;

  border-radius: 12px;

  background: #13264d;

  color: white;

  font-size: 14px;

  outline: none;
}


.swap {
  width: 45px;
  height: 45px;

  flex-shrink: 0;

  border: none;

  border-radius: 50%;

  background: #287cff;

  color: white;

  font-size: 22px;

  cursor: pointer;
}


/* =================================
   TEXT CARDS
================================= */

.card {
  background: #102247;

  padding: 14px;

  border-radius: 15px;

  margin-bottom: 14px;
}


textarea {
  display: block;

  width: 100%;

  min-height: 160px;

  resize: vertical;

  border: none;

  outline: none;

  border-radius: 10px;

  padding: 15px;

  font-size: 17px;

  line-height: 1.5;

  background: #f7f9fc;

  color: #111;
}


textarea::placeholder {
  color: #777;
}


#outputText {
  background: #eef2f7;
}


.counter {
  text-align: right;

  color: #8fa2c4;

  font-size: 12px;

  margin-top: 6px;
}


/* =================================
   TRANSLATE BUTTON
================================= */

.translate {
  width: 100%;

  padding: 15px;

  border: none;

  border-radius: 12px;

  background: #287cff;

  color: white;

  font-size: 18px;

  font-weight: bold;

  cursor: pointer;

  margin-bottom: 12px;
}


.translate:disabled {
  background: #53617a;

  cursor: not-allowed;
}


/* =================================
   VOICE BUTTONS
================================= */

.voice-buttons {
  display: flex;

  gap: 10px;

  margin-bottom: 15px;
}


.voice-btn {
  flex: 1;

  padding: 13px 8px;

  border: none;

  border-radius: 11px;

  background: #173563;

  color: white;

  font-size: 15px;

  cursor: pointer;
}


.voice-btn.active {
  background: #d94b5b;
}


/* =================================
   ACTION BUTTONS
================================= */

.actions {
  display: flex;

  gap: 10px;

  margin-bottom: 15px;
}


.action-btn {
  flex: 1;

  padding: 12px;

  border: 1px solid #41618f;

  border-radius: 10px;

  background: transparent;

  color: white;

  font-size: 15px;

  cursor: pointer;
}


/* =================================
   STATUS
================================= */

.status {
  text-align: center;

  min-height: 30px;

  margin-bottom: 8px;

  color: #aebbd2;

  font-size: 14px;

  line-height: 1.5;
}


.error {
  color: #ff9b9b;
}


.success {
  color: #9ee7b0;
}


/* =================================
   FOOTER
================================= */

.footer {
  text-align: center;

  color: #7185a8;

  font-size: 12px;

  margin-top: 25px;

  line-height: 1.5;
}


/* =================================
   MOBILE
================================= */

@media (max-width: 450px) {

  #app {
    padding: 18px 14px 30px;
  }

  h1 {
    font-size: 29px;
  }

  select {
    font-size: 12px;
  }

  .voice-btn {
    font-size: 13px;
  }

  .openingTitle {
    font-size: 38px;
  }

  .openingLogo {
    width: 88px;
    height: 88px;

    font-size: 45px;
  }

}

</style>
</head>
